<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Your own meal</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root { --ink:#141a24; --sec:#5b6474; --muted:#8b93a1; --line:#E1E5EB; --green:#2f7a3f; --rust:#b8471f; --red:#b42318; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #ECEDEF; font-family: Archivo, system-ui, sans-serif; color: var(--ink); padding: 32px 16px 70px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
  .sub { color: var(--sec); font-size: 13px; font-weight: 500; margin: 0 0 26px; max-width: 820px; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
  .phone { background: #F5F6F8; border-radius: 22px; box-shadow: inset 0 0 0 1px var(--line); padding: 18px 0 18px; }
  .tag { display: block; padding: 0 22px; font-size: 10.5px; letter-spacing: .16em; font-weight: 600; text-transform: uppercase; color: var(--green); }
  .tag.now { color: var(--rust); }
  .name { padding: 0 22px; font-size: 13px; font-weight: 600; margin: 2px 0 14px; }
  .meal { display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 22px; }
  .meal b { font-size: 17px; font-weight: 600; }
  .sp { flex: 1; }
  .ic { width: 40px; height: 40px; display: grid; place-items: center; }
  .ic svg, .chev svg, .more svg { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .ic svg { width: 20px; height: 20px; }
  .chev { color: #98A2B3; display: inline-grid; } .chev svg { width: 16px; height: 16px; }
  .note { padding: 0 22px; font-size: 14px; color: var(--muted); font-weight: 500; margin: 6px 0 20px; }
  .rm { padding: 0 22px; font-size: 14px; color: var(--rust); font-weight: 600; margin: 0 0 40px; }
  .rmw { font-size: 13px; font-weight: 600; color: var(--red); margin-right: 6px; }
  .add { display: flex; align-items: center; gap: 10px; padding: 14px 22px 0; font-size: 15px; font-weight: 600; }
  .add svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
  .explain { padding: 0 22px; margin: 14px 0 0; font-size: 12px; color: var(--muted); font-weight: 500; line-height: 1.45; }
  .menu { margin: -4px 22px 8px auto; width: 150px; background: #fff; border-radius: 14px; box-shadow: 0 18px 36px -16px rgba(16,24,40,.3), 0 0 0 1px var(--line); padding: 6px; }
  .menu div { height: 38px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; font-size: 14px; font-weight: 600; }
  .menu .r { color: var(--red); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Your own meal: now and options</h1>
  <p class="sub">A meal you added sits under Breakfast, Lunch, Dinner and Snacks. Empty, it doesn't look like them: it gets a chevron with nothing to fold, "None yet", and "Remove this meal" on a line of its own. In each option below the empty meal reads like the built-in ones.</p>
  <div class="grid">
    <script>
      const P = { plus: '<path d="M12 5v14M5 12h14"/>', cam: '<path d="M3.5 8.3A1.3 1.3 0 0 1 4.8 7h2.3l1.2-2h5.4l1.2 2h2.3a1.3 1.3 0 0 1 1.3 1.3V17a1.3 1.3 0 0 1-1.3 1.3H4.8A1.3 1.3 0 0 1 3.5 17z"/><circle cx="12" cy="12.4" r="3.1"/>', chev: '<path d="M6 9l6 6 6-6"/>', more: '<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>' };
      const ic = (k) => `<span class="ic"><svg viewBox="0 0 24 24">${P[k]}</svg></span>`;
      const row = (n, extra = "") => `<div class="meal"><b>${n}</b>${extra}<span class="sp"></span>${ic("plus")}${ic("cam")}</div>`;
      const builtin = row("Snacks");
      const add = `<div class="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add a meal</div>`;
      const opts = [
        { tag: "Now", now: true, name: "As it is", body: builtin + row("Pre-workout", '<span class="chev"><svg viewBox="0 0 24 24">' + P.chev + '</svg></span>') + '<p class="note">None yet</p><p class="rm">Remove this meal</p>' + add, explain: "A chevron with nothing under it, a sentence and a rust line, then a gap." },
        { tag: "Option A", name: "Remove as words on the row", body: builtin + `<div class="meal"><b>Pre-workout</b><span class="sp"></span><span class="rmw">Remove</span>${ic("plus")}${ic("cam")}</div>` + add, explain: "Just like Snacks, with Remove in red words before the + while it's empty. Once it holds a food, Remove goes and the chevron comes, as on any meal. My pick: nothing hidden, one line." },
        { tag: "Option B", name: "Remove in a ⋯ menu", body: builtin + `<div class="meal"><b>Pre-workout</b><span class="sp"></span><span class="ic" style="color:#5b6474"><svg viewBox="0 0 24 24">${P.more}</svg></span>${ic("plus")}${ic("cam")}</div><div class="menu"><div>Rename</div><div class="r">Remove</div></div>` + add, explain: "Just like Snacks plus a ⋯, which opens Rename and Remove. Tidiest row, and it can rename too, but Remove takes two taps." },
      ];
      document.write(opts.map((o) => `<div class="phone"><span class="tag${o.now ? " now" : ""}">${o.tag}</span><p class="name">${o.name}</p>${o.body}<p class="explain">${o.explain}</p></div>`).join(""));
    </script>
  </div>
</div>
</body>
</html>
