<!doctype html>
<!--
  Muscle map, round 2 (2 Nov 2026). Anatomy plate, front and back, opaque, greys and ink only;
  the training load colours the fibres in the training purple.

  Anatomy source: drawn for Norcoach in this file (no third-party artwork or path data).
  Checked first and not used: react-body-highlighter, @mjcdev/react-body-highlighter,
  react-native-body-highlighter, react-muscle-highlighter (MIT), body-muscles (Apache-2.0),
  react-muscle-map (Unlicense): all coarse icon-style group outlines, no fibres and no
  mid-back separation, so none of their paths are in here.
  Proportions follow the classic eight-heads figure (chin at 1, nipples 2, navel ~2.8,
  crotch 4, knee 6), the muscles placed from standard anterior and posterior plates.
  Each muscle is a patch between its two borders; its fibres are interpolated between them,
  so they run origin to insertion (the pectoral heads fan to the humerus).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muscle Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#F5F6F8; --ink:#141a24; --body:#3a4250; --sec:#5b6474; --muted:#8b93a1; --faint:#98A2B3;
  --hair:#E1E5EB; --btn:#DCE1E8; --div:#EEF0F3; --pur:#3a3390; --rust:#b8471f;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);font-family:Archivo,system-ui,sans-serif;font-weight:500;color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 48px}
.board{display:flex;align-items:center;gap:10px;height:16px;margin:0 0 14px 4px;font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--sec)}
.sep{display:inline-block;width:1px;height:11px;background:#C9CFD8;flex:none}

.card{background:#fff;border-radius:18px;box-shadow:inset 0 0 0 1px var(--hair);padding:20px 24px 24px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px 16px;flex-wrap:wrap}
.title{font-size:15px;font-weight:600;line-height:20px;height:20px}
.fact{display:flex;align-items:center;gap:8px;height:18px;margin-top:2px;font-size:12.5px;line-height:18px;color:var(--muted);font-variant-numeric:tabular-nums}
.ctrls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* capsule: the picked pill slides (SlidePills) */
.cap{position:relative;display:inline-flex;align-items:center;height:36px;padding:4px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px var(--btn)}
.cap button{position:relative;z-index:1;appearance:none;border:0;background:none;margin:0;font:inherit;font-size:13px;font-weight:500;color:var(--body);height:28px;line-height:28px;padding:0 14px;border-radius:999px;cursor:pointer;transition:color .25s ease;white-space:nowrap}
.cap button[aria-pressed="true"]{color:#fff}
.cap .knob{position:absolute;top:4px;left:4px;height:28px;width:0;border-radius:999px;background:var(--ink);transition:left .25s ease,width .25s ease}
.cap.nojump .knob{transition:none}

/* group chips: separate white hairline pills, ink while on; they swap at once */
.chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px}
.chip{appearance:none;border:0;margin:0;font:inherit;font-size:13px;font-weight:500;height:32px;line-height:32px;padding:0 14px;border-radius:999px;background:#fff;color:var(--body);box-shadow:inset 0 0 0 1px var(--btn);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}

.body{display:grid;grid-template-columns:minmax(0,1fr) 284px;gap:24px 40px;margin-top:20px}
@media (max-width:980px){ .body{grid-template-columns:minmax(0,1fr)} }

/* the plate */
.plate{position:relative;display:flex;justify-content:center;gap:32px;min-width:0}
.view{display:flex;flex-direction:column;align-items:center;flex:0 1 261px;min-width:0}
.view > div:first-child{width:100%}
.view svg{display:block;width:100%;height:auto;aspect-ratio:261/790;overflow:visible}
.cap-l{display:flex;align-items:center;justify-content:center;height:16px;margin-top:8px;font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}

/* the drawing */
.u-out{fill:none;stroke:#141a24;stroke-width:2;stroke-linejoin:round}
.u-base{fill:#D9DDE3}
.m .mf{fill:var(--mf,#ECEEF2)}
.m .fb{fill:none;stroke:var(--fb,#A7AEBA);stroke-width:.5;stroke-linecap:round}
.m .sh{fill:none;stroke:var(--sh,#C3C9D2);stroke-width:5;stroke-opacity:.5}
.m .ol{fill:none;stroke:#141a24;stroke-width:.6;stroke-linejoin:round}
.m .td{fill:#E8EAEE}
.m .tf{fill:none;stroke:#CDD2DA;stroke-width:.45}
.m.tendon .mf{fill:#E8EAEE}.m.tendon .fb{stroke:#CDD2DA;stroke-width:.45}.m.tendon .sh{stroke:#E1E5EB}
.m.bone .mf{fill:#E6E9ED}.m.bone .fb{display:none}.m.bone .sh{stroke:#E4E7EB;stroke-width:3}
.skin{fill:#E6E9EE;stroke:#141a24;stroke-width:.6;stroke-linejoin:round}
.det{fill:none;stroke:#8E96A3;stroke-width:.55;stroke-linecap:round;stroke-linejoin:round}
.det.soft{stroke:#AEB5C0}
.hair{fill:#CDD2DA;stroke:#141a24;stroke-width:.6;stroke-linejoin:round}
.eye{fill:#F4F5F7;stroke:#5b6474;stroke-width:.55}
.m[data-muscle]:not([data-muscle=""]){cursor:default}
.m.hl .ol{stroke-width:1.3}
.m.off .mf{fill:#F1F2F4}.m.off .fb{stroke:#C5CAD2}

/* hover pill */
.pill{position:absolute;left:0;top:0;z-index:5;display:flex;align-items:center;gap:8px;height:28px;padding:0 11px;border-radius:999px;background:#fff;
  box-shadow:inset 0 0 0 1px var(--hair);font-size:12px;line-height:28px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s ease}
.pill.on{opacity:1}
.pill b{font-weight:600;color:var(--ink)}
.pill .g{color:var(--muted)}
.pill .v{color:var(--body);font-variant-numeric:tabular-nums}

/* side list */
.side{min-width:0;padding-top:4px}
.sh-row{display:flex;align-items:center;justify-content:space-between;height:16px;margin-bottom:6px;font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--sec)}
.row{display:grid;grid-template-columns:18px 104px minmax(0,1fr) 34px;align-items:center;gap:10px;height:28px;margin:0 -8px;padding:0 8px;border-radius:8px;cursor:default}
.row:hover{background:#fafbfd}
.rk{font-size:11.5px;line-height:16px;color:var(--faint);font-variant-numeric:tabular-nums}
.nm{font-size:13.5px;line-height:20px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;border-radius:2px;background:var(--div);overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;transition:width .25s ease,background-color .25s ease}
.val{font-size:13px;line-height:20px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.row.lo .nm{color:var(--sec)}
.row.lo .val{color:var(--muted);font-weight:500}
.flag{display:block;width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(184,71,31,.7)}
.empty{height:28px;display:flex;align-items:center;font-size:13px;color:var(--muted)}
.legend{margin-top:20px}
.sw{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.sw i{display:block;height:8px;border-radius:2px;transition:background-color .25s ease}
.sw i:first-child{background:repeating-linear-gradient(100deg,#A7AEBA 0 1px,transparent 1px 3px),#ECEEF2}
.lgl{display:flex;justify-content:space-between;align-items:center;height:16px;margin-top:6px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
/* Archivo's capitals sit high in their line box: measured, then set on the middle */
.title,.val,.nm,.sh-row span,.pill b,.pill .g,.pill .v{position:relative;top:.5px}
.cap button{line-height:27px;padding-top:1px}
.chip{line-height:31px;padding-top:1px}
.cap-l,.fact,.board{padding-top:1px}
</style>
</head>

/* ---------------- geometry ---------------- */
const CX = 200;
const n1 = v => Math.round(v * 10) / 10;
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
function bz(P, t){ const u = 1 - t, a = u*u*u, b = 3*u*u*t, c = 3*u*t*t, d = t*t*t;
  return [a*P[0][0] + b*P[1][0] + c*P[2][0] + d*P[3][0], a*P[0][1] + b*P[1][1] + c*P[2][1] + d*P[3][1]]; }
function ctr(p, q, c){
  if (Array.isArray(c)) return c;
  const bow = c || 0, dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L * bow, ny = dx / L * bow;
  return [[p[0] + dx/3 + nx, p[1] + dy/3 + ny], [p[0] + 2*dx/3 + nx, p[1] + 2*dy/3 + ny]];
}
function split(P, t0, t1){ /* the part of a cubic between t0 and t1 */
  const sub = (Q, t) => { const a = lerp(Q[0],Q[1],t), b = lerp(Q[1],Q[2],t), c = lerp(Q[2],Q[3],t), d = lerp(a,b,t), e = lerp(b,c,t), f = lerp(d,e,t);
    return [[Q[0], a, d, f], [f, e, c, Q[3]]]; };
  let R = sub(P, t1)[0]; if (t0 > 0) R = sub(R, t0 / t1)[1]; return R;
}

/* the female body: narrower shoulders and waist, wider hips; the arms ride with the shoulders */
const FW = [[0,.95],[128,.95],[150,.9],[175,.88],[235,.89],[285,.87],[312,.86],[340,.95],[380,1.04],[425,1.08],[470,1.06],[540,1.02],[660,.97],[900,.96]];
const ARMX = [[175,114],[330,112],[445,100],[560,99]];
const tab = (T, y) => { if (y <= T[0][0]) return T[0][1]; for (let i = 1; i < T.length; i++) if (y <= T[i][0]){ const a = T[i-1], b = T[i]; return a[1] + (y - a[0]) / (b[0] - a[0]) * (b[1] - a[1]); } return T[T.length-1][1]; };
const PIV = [116,185], ROT = 2.5 * Math.PI / 180;
function warp(p, arm, g){
  let [x, y] = p;
  if (arm){ const dx = x - PIV[0], dy = y - PIV[1]; if (dy > 0){ x = PIV[0] + dx * Math.cos(ROT) - dy * Math.sin(ROT); y = PIV[1] + dx * Math.sin(ROT) + dy * Math.cos(ROT); } }
  if (g !== "female") return [x, y, p[2]];
  if (!arm) return [CX + (x - CX) * tab(FW, y), y, p[2]];
  const ax = tab(ARMX, y), thin = Math.max(0, Math.min(1, (y - 175) / 55));
  x = ax + (x - ax) * (1 - .14 * thin);
  x += 10.5 - Math.max(0, y - 190) / 250 * 13;
  return [x, y, p[2]];
}

const mir = p => [2*CX - p[0], p[1], p[2]];
function smooth(pts, closed = true){
  const n = pts.length, P = i => pts[(i + n) % n];
  let d = `M${n1(pts[0][0])},${n1(pts[0][1])}`;
  for (let i = 0; i < (closed ? n : n - 1); i++){
    const p0 = closed ? P(i-1) : pts[Math.max(i-1,0)], p1 = P(i), p2 = P(i+1), p3 = closed ? P(i+2) : pts[Math.min(i+2,n-1)];
    const c1 = p1[2] ? p1 : [p1[0] + (p2[0]-p0[0])/6, p1[1] + (p2[1]-p0[1])/6], c2 = p2[2] ? p2 : [p2[0] - (p3[0]-p1[0])/6, p2[1] - (p3[1]-p1[1])/6];
    d += `C${n1(c1[0])},${n1(c1[1])} ${n1(c2[0])},${n1(c2[1])} ${n1(p2[0])},${n1(p2[1])}`;
  }
  return closed ? d + "Z" : d;
}
const halfToFull = h => h.concat(h.slice(1, -1).reverse().map(mir));
const C = P => `C${n1(P[1][0])},${n1(P[1][1])} ${n1(P[2][0])},${n1(P[2][1])} ${n1(P[3][0])},${n1(P[3][1])}`;
const M = p => `M${n1(p[0])},${n1(p[1])}`;
const rev = P => [P[3], P[2], P[1], P[0]];

/* one patch, on one side, in one body: its curves */
function patch(m, flip, g){
  const W = p => { const q = warp(p, m.arm, g); return flip ? mir(q) : q; };
  const [s0, s1] = m.a, [e0, e1] = m.b;
  const A = [s0, ...ctr(s0, s1, m.ac), s1].map(W), B = [e0, ...ctr(e0, e1, m.bc), e1].map(W);
  const L = [s0, ...ctr(s0, e0, m.c0), e0].map(W), R = [s1, ...ctr(s1, e1, m.c1), e1].map(W);
  return { A, B, L, R };
}
function fibre(P, s){ /* Coons-like blend: the fibre at s, as a cubic */
  const S = bz(P.A, s), E = bz(P.B, s);
  const bil = t => { const a = lerp(P.A[0], P.A[3], s), b = lerp(P.B[0], P.B[3], s); return lerp(a, b, t); };
  const mid = (k, t) => { const l = P.L[k], r = P.R[k], ab = lerp(bz(P.A, s), bz(P.B, s), t), side = lerp(l, r, s), lin = lerp(lerp(P.L[0], P.R[0], s), lerp(P.L[3], P.R[3], s), t);
    return [side[0] + ab[0] - lin[0], side[1] + ab[1] - lin[1]]; };
  return [S, mid(1, 1/3), mid(2, 2/3), E];
}
const outline = P => M(P.L[0]) + C(P.L) + C(P.B) + C(rev(P.R)) + C(rev(P.A)) + "Z";
const len = P => { let l = 0, q = P[0]; for (let i = 1; i <= 8; i++){ const r = bz(P, i/8); l += Math.hypot(r[0]-q[0], r[1]-q[1]); q = r; } return l; };
function sampled(P, s0, s1, t0, t1){ /* the region s0..s1, t0..t1 of a patch as a polygon */
  const pts = [], N = 10;
  for (let i = 0; i <= N; i++) pts.push(bz(fibre(P, s0), t0 + (t1 - t0) * i / N));
  for (let i = 0; i <= N; i++) pts.push(bz(fibre(P, s0 + (s1 - s0) * i / N), t1));
  for (let i = N; i >= 0; i--) pts.push(bz(fibre(P, s1), t0 + (t1 - t0) * i / N));
  for (let i = N; i >= 0; i--) pts.push(bz(fibre(P, s0 + (s1 - s0) * i / N), t0));
  return "M" + pts.map(p => `${n1(p[0])},${n1(p[1])}`).join("L") + "Z";
}

let uid = 0;
function drawMuscle(m, flip, g, view){
  const P = patch(m, flip, g), id = `cl${view}${uid++}`, d = outline(P);
  if (m.t === "skin") return `<path class="skin" d="${d}"/>`;
  const w = Math.max(len(P.A), len(P.B), Math.hypot(...[0,1].map(i => bz(P.L, .5)[i] - bz(P.R, .5)[i])));
  const tendon = m.t === "tendon", gap = tendon ? 3.4 : 2.3, n = Math.max(2, Math.round(w / gap));
  const t0 = m.ta || 0, t1 = 1 - (m.tb || 0);
  let fb = "", tf = "", td = "";
  if (m.t !== "bone"){
    if (m.pen){
      const spine = fibre(P, .5), Ln = len(spine), steps = Math.max(6, Math.round(Ln / 2.6));
      for (let i = 0; i < steps; i++){
        const t = t0 + (t1 - t0) * (i + .3) / steps, c = bz(spine, t), dt = .07;
        const a = bz(fibre(P, .02), Math.min(t1, t + dt)), b = bz(fibre(P, .98), Math.min(t1, t + dt));
        fb += `${M(c)}L${n1(a[0])},${n1(a[1])}${M(c)}L${n1(b[0])},${n1(b[1])}`;
      }
      fb += M(bz(spine, t0)) + C(split(spine, t0 || 1e-6, t1));
    } else {
      const wA = len(P.A), wB = len(P.B), MIN = .8;
      const tz = i => { let l = 0; while (i > 0 && i % 2 === 0 && l < 6){ i /= 2; l++; } return l; };
      for (let i = 0; i < n; i++){
        const stride = 2 ** tz(i + 1), reach = MIN * n / stride;
        let a = t0, b = t1;
        if (wB < wA && reach > wB) b = Math.min(t1, Math.max(t0 + .05, (reach - wA) / (wB - wA)));
        if (wA < wB && reach > wA) a = Math.max(t0, Math.min(t1 - .05, 1 - (reach - wB) / (wA - wB)));
        const F = split(fibre(P, (i + .5) / n), a || 1e-6, b); fb += M(F[0]) + C(F);
      }
    }
    if (t1 < 1){ td += sampled(P, 0, 1, t1, 1); for (let i = 0; i < Math.max(2, Math.round(n / 2)); i++){ const F = split(fibre(P, (i + .5) / Math.max(2, Math.round(n / 2))), t1, 1); tf += M(F[0]) + C(F); } }
    if (t0 > 0){ td += sampled(P, 0, 1, 0, t0); }
  }
  const cls = `m${tendon ? " tendon" : ""}${m.t === "bone" ? " bone" : ""}`;
  const key = m.t ? "" : (m.k || "");
  return `<g class="${cls}" data-muscle="${key}" data-n="${m.n}">
    <clipPath id="${id}"><path d="${d}"/></clipPath>
    <path class="mf" d="${d}"/>
    <g clip-path="url(#${id})"><path class="fb" d="${fb}"/>${td ? `<path class="td" d="${td}"/><path class="tf" d="${tf}"/>` : ""}<path class="sh" d="${d}"/></g>
    <path class="ol" d="${d}"/></g>`;
}

function hullPaths(g, view){
  const W = (pts, arm) => pts.map(p => warp(p, arm, g));
  const body = smooth(halfToFull(W(HULL, 0)));
  const head = smooth(halfToFull(W(HEAD, 0)).map(p => p));
  const armL = smooth(W(ARM, 1)), armR = smooth(W(ARM, 1).map(mir));
  const hand = smooth(W(HAND, 1)), handR = smooth(W(HAND, 1).map(mir));
  const foot = view === "F" ? FOOT_F : FOOT_B;
  const footL = smooth(W(foot, 0)), footR = smooth(W(foot, 0).map(mir));
  const ear = smooth(W(EAR, 0)), earR = smooth(W(EAR, 0).map(mir));
  const thumb = smooth(W(THUMB, 1)), thumbR = smooth(W(THUMB, 1).map(mir));
  const line = (pts, arm, f) => { const q = W(pts, arm).map(p => f ? mir(p) : p); return M(q[0]) + q.slice(1).map(p => `L${n1(p[0])},${n1(p[1])}`).join(""); };
  const fingers = HAND_LINES.map(l => line(l, 1, 0) + line(l, 1, 1)).join("");
  const toes = view === "F" ? TOES.concat(FOOT_LINES).map(l => line(l, 0, 0) + line(l, 0, 1)).join("") : "";
  return { body, head, armL, armR, hand, handR, footL, footR, ear, earR, thumb, thumbR, fingers, toes };
}

/* the face, the hair and the breast line: grey drawing, never coloured */
function face(view, g){
  const W = p => warp(p, 0, g), both = f => f(0) + f(1);
  const pt = (p, fl) => { const q = W(p); return `${n1(fl ? 2*CX - q[0] : q[0])},${n1(q[1])}`; };
  /* points: start, then control and end in pairs */
  const Q = (pts, fl, z) => `M${pt(pts[0], fl)}` + pts.slice(1).reduce((a, p, i, r) => i % 2 ? a : a + `Q${pt(p, fl)} ${pt(r[i+1], fl)}`, "") + (z ? "Z" : "");
  let s = "";
  if (view === "F"){
    const nv = W([200,318]);
    s += `<ellipse class="skin" cx="200" cy="${n1(nv[1])}" rx="2.2" ry="3"/>`;
    if (g === "female") s += both(fl => `<path class="det soft" d="${smooth(BREAST.map(p => { const q = W(p); return fl ? mir(q) : q; }), false)}"/>`);
  }
  if (g === "female"){
    s += `<path class="hair" d="${smooth(halfToFull((view === "F" ? HAIR_F : HAIR_B).map(W)))}"/>`;
    s += view === "F"
      ? both(fl => `<path class="det soft" d="${Q([[200,17],[177,22],[165,50]], fl)}"/>`)
      : both(fl => `<path class="det soft" d="${Q([[200,17],[176,32],[170,66],[176,98],[190,108]], fl)}"/>`);
  }
  return s;
}

function buildView(view, g){
  const Hp = hullPaths(g, view), list = view === "F" ? FRONT : BACK;
  const all = [Hp.body, Hp.armL, Hp.armR, Hp.head, Hp.hand, Hp.handR, Hp.thumb, Hp.thumbR, Hp.footL, Hp.footR, Hp.ear, Hp.earR];
  let s = `<svg viewBox="56 14 288 872" aria-label="${view === "F" ? "Front" : "Back"}">`;
  /* the outline of the whole body, once, then the base */
  s += `<g class="u-out">${all.map(d => `<path d="${d}"/>`).join("")}</g>`;
  s += `<g class="u-base">${all.map(d => `<path d="${d}"/>`).join("")}</g>`;
  /* ears, head, hands, feet */
  if (g === "female"){ const b = warp([200,22], 0, g); s += `<ellipse class="hair" cx="200" cy="${n1(b[1])}" rx="15" ry="11"/>`; }
  s += `<path class="skin" d="${Hp.ear}"/><path class="skin" d="${Hp.earR}"/><path class="skin" d="${Hp.head}"/>`;
  s += `<path class="skin" d="${Hp.hand}"/><path class="skin" d="${Hp.handR}"/><path class="skin" d="${Hp.thumb}"/><path class="skin" d="${Hp.thumbR}"/><path class="det" d="${Hp.fingers}"/>`;
  s += `<path class="skin" d="${Hp.footL}"/><path class="skin" d="${Hp.footR}"/><path class="det" d="${Hp.toes}"/>`;
  for (const m of list){
    s += drawMuscle(m, false, g, view);
    if (!m.c) s += drawMuscle(m, true, g, view);
  }
  s += face(view, g);
  return s + `</svg>`;
}

/* ---------------- colour ---------------- */
const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const RAMP = [[0, hex("#E3E0F5")], [.35, hex("#BCB7E4")], [.68, hex("#7A73CC")], [1, hex("#3a3390")]];
const FILL = [[0, hex("#E9E7F6")], [.5, hex("#C9C5EC")], [1, hex("#9F99DC")]];
function mixRamp(stops, t){
  t = Math.max(0, Math.min(1, t));
  for (let i = 1; i < stops.length; i++){
    if (t <= stops[i][0]){ const a = stops[i-1], b = stops[i], u = (t - a[0]) / (b[0] - a[0]);
      return a[1].map((v, j) => Math.round(v + (b[1][j] - v) * u)); }
  }
  return stops[stops.length-1][1];
}
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const loadColour = t => rgb(mixRamp(RAMP, t));
const fillColour = t => rgb(mixRamp(FILL, t));
const fibreColour = t => rgb(mixRamp([[0, hex("#A7A1DE")], [.5, hex("#5a53b8")], [1, hex("#2a2475")]], t));
const shadeColour = t => rgb(mixRamp([[0, hex("#C2BDE8")], [1, hex("#5a53b8")]], t));

/* ---------------- state ---------------- */
let gender = CLIENT.gender === "female" ? "female" : "male";
let win = "phase";
const on = Object.fromEntries(GROUPS.map(([g]) => [g, true]));
const groupOf = k => GROUPS.find(([, ks]) => ks.includes(k))[0];

const $ = id => document.getElementById(id);
const fmt = v => (Math.round(v * 10) / 10).toString();
const setsWord = v => `${fmt(v)} ${v === 1 ? "set" : "sets"}`;

function render(){
  uid = 0;
  $("vF").innerHTML = buildView("F", gender);
  $("vB").innerHTML = buildView("B", gender);
  applyLoad();
}

function activeKeys(){ return Object.keys(NAMES).filter(k => on[groupOf(k)]); }

function applyLoad(){
  const L = LOAD[win] || {}, keys = activeKeys();
  const max = Math.max(1e-6, ...keys.map(k => L[k] || 0));
  document.querySelectorAll(".m[data-muscle]").forEach(g => {
    const k = g.dataset.muscle, st = g.style;
    g.classList.remove("off");
    if (!k){ return; }
    const live = on[groupOf(k)], s = live ? (L[k] || 0) : 0, t = s / max;
    if (!live) g.classList.add("off");
    if (s <= 0){ ["--mf","--fb","--sh"].forEach(v => st.removeProperty(v)); return; }
    st.setProperty("--mf", fillColour(t));
    st.setProperty("--fb", fibreColour(t));
    st.setProperty("--sh", shadeColour(t));
  });

  const total = keys.reduce((a, k) => a + (L[k] || 0), 0);
  const f = FACTS[win];
  $("fact").innerHTML = win === "phase"
    ? `<span>${f[0]}</span><span class="sep"></span><span>${f[1]}</span><span class="sep"></span><span>${fmt(total)} sets</span>`
    : `<span>${f[0]}</span><span class="sep"></span><span>${fmt(total)} sets ${f[1]}</span>`;
  $("listHead").textContent = win === "phase" ? "Sets this phase" : "Sets a week";

  const sorted = keys.map(k => [k, L[k] || 0]).sort((a, b) => b[1] - a[1]);
  const lowN = Math.min(3, Math.max(0, sorted.length - 3));
  const row = (k, v, i, lo) => `<div class="row${lo ? " lo" : ""}" data-k="${k}">
      ${lo ? `<span class="flag" title="Least trained"></span>` : `<span class="rk">${i + 1}</span>`}
      <span class="nm">${NAMES[k]}</span>
      <span class="bar"><i style="width:${(v / max * 100).toFixed(1)}%;background-color:${v > 0 ? loadColour(v / max) : "transparent"}"></i></span>
      <span class="val">${fmt(v)}</span></div>`;
  $("list").innerHTML = sorted.length
    ? sorted.map(([k, v], i) => row(k, v, i, i >= sorted.length - lowN)).join("")
    : `<div class="empty">None</div>`;
  const sw = $("sw").children;
  for (let i = 1; i < 6; i++){ const u = i / 5; sw[i].style.background = `repeating-linear-gradient(100deg, ${fibreColour(u)} 0 1px, transparent 1px 3px), ${fillColour(u)}`; }
  $("lgMax").textContent = setsWord(sorted.length ? max : 0);
  hookRows();
}

/* rows light their muscles */
function hookRows(){
  document.querySelectorAll("#list .row").forEach(r => {
    r.addEventListener("mouseenter", () => document.querySelectorAll(`.m[data-muscle="${r.dataset.k}"]`).forEach(g => g.classList.add("hl")));
    r.addEventListener("mouseleave", () => document.querySelectorAll(".m.hl").forEach(g => g.classList.remove("hl")));
  });
}

/* the hover pill */
const plate = $("plate"), pill = $("pill");
plate.addEventListener("mousemove", e => {
  const g = e.target.closest(".m");
  if (!g){ pill.classList.remove("on"); return; }
  const k = g.dataset.muscle, n = g.dataset.n, L = LOAD[win] || {};
  $("pN").textContent = n;
  const tracked = k && on[groupOf(k)];
  $("pG").textContent = tracked ? NAMES[k] : "";
  $("pV").textContent = tracked ? setsWord(L[k] || 0) : "";
  $("pS1").style.display = $("pG").style.display = $("pS2").style.display = $("pV").style.display = tracked ? "" : "none";
  const r = plate.getBoundingClientRect();
  pill.classList.add("on");
  const w = pill.offsetWidth;
  let x = e.clientX - r.left + 14, y = e.clientY - r.top - 40;
  if (x + w > r.width) x = e.clientX - r.left - w - 14;
  pill.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
});
plate.addEventListener("mouseleave", () => pill.classList.remove("on"));

/* ---------------- controls ---------------- */
function capsule(el, value, onPick){
  const knob = el.querySelector(".knob"), btns = [...el.querySelectorAll("button")];
  const place = () => { const b = btns.find(b => b.getAttribute("aria-pressed") === "true"); if (!b) return;
    knob.style.left = b.offsetLeft + "px"; knob.style.width = b.offsetWidth + "px"; };
  const set = v => { btns.forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v ? "true" : "false")); place(); };
  btns.forEach(b => b.addEventListener("click", () => { set(b.dataset.v); onPick(b.dataset.v); }));
  el.classList.add("nojump"); set(value);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove("nojump")));
  return { set, place };
}
const capW = capsule($("capW"), win, v => { win = v; applyLoad(); });
const capG = capsule($("capG"), gender, v => { gender = v; render(); });
const replace = () => [capW, capG].forEach(c => c.place());
if (document.fonts && document.fonts.ready) document.fonts.ready.then(replace);
addEventListener("resize", replace);

$("chips").innerHTML = GROUPS.map(([g]) => `<button class="chip" data-g="${g}" aria-pressed="true">${g}</button>`).join("");
$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  on[b.dataset.g] = !on[b.dataset.g];
  b.setAttribute("aria-pressed", on[b.dataset.g] ? "true" : "false");
  applyLoad();
});

render();
</script>
</body>
