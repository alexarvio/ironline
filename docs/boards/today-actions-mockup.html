<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Today's actions</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root { --ink:#141a24; --sec:#5b6474; --muted:#8b93a1; --line:#E1E5EB; --green:#2f7a3f; --rust:#b8471f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #ECEDEF; font-family: Archivo, system-ui, sans-serif; color: var(--ink); padding: 32px 16px 70px; }
  .wrap { max-width: 1260px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
  .sub { color: var(--sec); font-size: 13px; font-weight: 500; margin: 0 0 26px; max-width: 820px; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
  .phone { background: #F5F5F5; border-radius: 22px; box-shadow: inset 0 0 0 1px var(--line); padding: 18px 4px 14px; }
  .tag { display: block; padding: 0 16px; font-size: 10.5px; letter-spacing: .16em; font-weight: 600; text-transform: uppercase; color: var(--green); margin: 0 0 2px; }
  .tag.now { color: var(--rust); }
  .name { padding: 0 16px; font-size: 13px; font-weight: 600; margin: 0 0 16px; }
  .head { display: block; padding: 0 16px 4px; font-size: 11.5px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
  .row { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; }
  .ic { flex: none; width: 24px; display: grid; place-items: center; }
  .ic svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .tx b { font-size: 15px; font-weight: 500; line-height: 20px; }
  .tx small { font-size: 12px; font-weight: 500; color: var(--muted); line-height: 16px; }
  .tx small i { display: inline-block; width: 1px; height: .8em; background: #c9cfd8; margin: 0 .5em; vertical-align: -.08em; }
  /* Now */
  .act { flex: none; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .act.ink { display: inline-flex; align-items: center; height: 36px; padding: 0 18px; border-radius: 999px; background: var(--ink); color: #fff; }
  /* A: one pill width, centred */
  .pa { flex: none; width: 84px; height: 36px; border-radius: 999px; display: grid; place-items: center; font-size: 13px; font-weight: 600; background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
  .pa.ink { background: var(--ink); color: #fff; box-shadow: none; }
  /* B: words in one centred column */
  .wb { flex: none; width: 84px; text-align: center; font-size: 13px; font-weight: 600; }
  /* C: round icon buttons */
  .rc { flex: none; width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center; background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
  .rc.ink { background: var(--ink); color: #fff; box-shadow: none; }
  .rc svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .note { padding: 0 16px; margin: 14px 0 0; font-size: 12px; color: var(--muted); font-weight: 500; line-height: 1.45; }
  .guide { position: relative; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Today's actions: now and options</h1>
  <p class="sub">Today, the session's Start is an ink pill while Fill in and Add are words, so they all sit at different places on the right. Each option below gives the three one shape and one centre line.</p>
  <div class="grid">
    <script>
      const ICONS = {
        dumb: '<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',
        heart: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
        cam: '<path d="M3.5 8.3A1.3 1.3 0 0 1 4.8 7h2.3l1.2-2h5.4l1.2 2h2.3a1.3 1.3 0 0 1 1.3 1.3V17a1.3 1.3 0 0 1-1.3 1.3H4.8A1.3 1.3 0 0 1 3.5 17z"/><circle cx="12" cy="12.4" r="3.1"/>',
        play: '<path d="M8 5.5v13l10.5-6.5z"/>',
        pen: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
        plus: '<path d="M12 5v14M5 12h14"/>',
      };
      const svg = (k) => `<svg viewBox="0 0 24 24">${ICONS[k]}</svg>`;
      const rows = [
        { icon: "dumb", color: "#3a3390", title: "Upper — push", fact: "6 exercises<i></i>about 55 min", word: "Start", ink: true, glyph: "play" },
        { icon: "heart", color: "#a08a5c", title: "Check-in", fact: "4 of 4 still to fill", word: "Fill in", glyph: "pen" },
        { icon: "cam", color: "#b8471f", title: "Shape update", fact: "0 of 5 photos", word: "Add", glyph: "plus" },
      ];
      const opts = [
        { tag: "Now", now: true, name: "Pill, then words", act: (r) => `<span class="act${r.ink ? " ink" : ""}">${r.word}</span>`, note: "Start sits further right and taller than Fill in and Add, so the three don't line up." },
        { tag: "Option A", name: "One pill width, centred", act: (r) => `<span class="pa${r.ink ? " ink" : ""}">${r.word}</span>`, note: "Every action is an 84px pill, its word centred. Start stays the one ink pill; Fill in and Add are the white hairline pill. My pick: it reads as three of one kind, with the session first." },
        { tag: "Option B", name: "Words in one column", act: (r) => `<span class="wb">${r.word}</span>`, note: "Every action is its words alone, centred in one 84px column. Calmest, but the session loses its ink pill, so nothing says start here first." },
        { tag: "Option C", name: "Round icon buttons", act: (r) => `<span class="rc${r.ink ? " ink" : ""}">${svg(r.glyph)}</span>`, note: "A 36px round button each, as the coach's Needs you rows: play, pencil, plus. Start the ink one. Smallest, but a client has to read the icon." },
      ];
      document.write(opts.map((o) => `<div class="phone"><span class="tag${o.now ? " now" : ""}">${o.tag}</span><p class="name">${o.name}</p><span class="head">Today</span>${rows.map((r) => `<div class="row"><span class="ic" style="color:${r.color}">${svg(r.icon)}</span><span class="tx"><b>${r.title}</b><small>${r.fact}</small></span>${o.act(r)}</div>`).join("")}<p class="note">${o.note}</p></div>`).join(""));
    </script>
  </div>
</div>
</body>
</html>
