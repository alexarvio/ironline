<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise pop-up mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--text-primary:#141a24;--text-secondary:#5b6474;--text-muted:#8b93a1;--border:#DCE1E8;--border-strong:#c9cfd8;--surface-1:#F5F6F8;--surface-2:#fff;--radius:8px}
body{margin:0;background:#fff;font-family:Archivo,system-ui,sans-serif;color:#141a24}
.wrap{max-width:700px;margin:0 auto;padding:20px 16px 40px}
.pick{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.pick button{font:500 13px Archivo,system-ui,sans-serif;height:34px;padding:0 14px;border-radius:999px;border:0;background:#fff;box-shadow:inset 0 0 0 1px #DCE1E8;color:#141a24;cursor:pointer}
.pick button.on{background:#141a24;color:#fff;box-shadow:none}
.pick small{font-weight:500;color:inherit;opacity:.7;margin-left:6px}
</style></head><body><div class="wrap">
<div class="pick" role="group" aria-label="Mockup"><button type="button" data-k="A">A · Same parts, new style</button><button type="button" data-k="B">B · Verdict and chart first<small>review's pick</small></button><button type="button" data-k="C">C · Sessions table first</button></div>
<section data-v="A">
<div class="expm-a">
  <div class="mc"><span>State</span><button type="button" data-st="0">Progressing</button><button type="button" data-st="1">Stalling</button><button type="button" data-st="2">Too early</button></div>
  <div class="bk"><div class="cd" role="dialog" aria-label="Exercise progress"></div></div>
</div>
<style>
.expm-a { font-family: Archivo, system-ui, sans-serif; }
.expm-a [hidden] { display: none !important; }
.expm-a .mc { display: flex; align-items: center; gap: 6px; margin: 0 0 10px; font-size: 12px; color: var(--text-secondary); }
.expm-a .mc button { padding: 3px 9px; border: 1px solid var(--border); border-radius: 6px; background: transparent; font: inherit; font-size: 12px; color: var(--text-secondary); cursor: pointer; }
.expm-a .mc button.on { border-color: currentColor; font-weight: 600; }
.expm-a .bk { display: flex; justify-content: center; padding: 28px 20px; border-radius: 12px; background: rgba(16, 24, 40, 0.32); }
.expm-a .cd { position: relative; display: flex; flex-direction: column; gap: 18px; width: 100%; max-width: 620px; box-sizing: border-box; padding: 20px 20px 16px; border-radius: 20px; background: #fff; box-shadow: 0 30px 60px -24px rgba(16, 24, 40, 0.35), 0 0 0 1px #e1e5eb; color: #141a24; font-weight: 500; text-align: left; }
.expm-a .hd { display: flex; align-items: flex-start; gap: 12px; }
.expm-a .hl { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.expm-a .tt { margin: 0; overflow: hidden; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; color: #141a24; text-overflow: ellipsis; white-space: nowrap; }
.expm-a .fx { display: flex; flex-wrap: wrap; align-items: center; font-size: 13.5px; color: #5b6474; font-variant-numeric: tabular-nums; }
.expm-a .sp { display: inline-block; flex: none; width: 1.5px; height: 0.85em; margin: 0 0.55em; border-radius: 1px; background: #b0b7c3; vertical-align: -0.1em; }
.expm-a .seg { display: inline-flex; flex: none; gap: 2px; height: 36px; padding: 4px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 1px #dce1e8; box-sizing: border-box; }
.expm-a .seg button { height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: none; font: inherit; font-size: 13px; font-weight: 500; color: #5b6474; white-space: nowrap; cursor: pointer; }
.expm-a .seg button:hover:not(.on) { color: #141a24; }
.expm-a .seg button.on { background: #141a24; font-weight: 600; color: #fff; }
.expm-a .x { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; margin: 4px -4px 0 0; padding: 0; border: 0; border-radius: 999px; background: none; color: #8b93a1; cursor: pointer; }
.expm-a .x:hover { background: #f5f6f8; color: #141a24; }
.expm-a .x svg { width: 12px; height: 12px; }
.expm-a .gw { position: relative; display: inline-flex; }
.expm-a .gb { display: inline-flex; align-items: center; gap: 3px; padding: 0; border: 0; background: none; font: inherit; color: #141a24; cursor: pointer; }
.expm-a .gb svg { width: 14px; height: 14px; color: #8b93a1; translate: 0 -0.5px; transition: transform 0.15s; }
.expm-a .gb[aria-expanded="true"] svg { transform: rotate(180deg); }
.expm-a .gm { position: absolute; top: calc(100% + 6px); left: -10px; z-index: 5; display: flex; flex-direction: column; min-width: 190px; padding: 6px; border-radius: 14px; background: #fff; box-shadow: 0 24px 48px -20px rgba(16, 24, 40, 0.3), 0 0 0 1px #e1e5eb; }
.expm-a .gm button { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: none; font: inherit; font-size: 13.5px; font-weight: 500; color: #3a4250; text-align: left; cursor: pointer; }
.expm-a .gm button:hover { background: #f5f6f8; color: #141a24; }
.expm-a .gm button.on { font-weight: 600; color: #141a24; }
.expm-a .gm svg { width: 14px; height: 14px; }
.expm-a .vd { display: flex; flex-wrap: wrap; align-items: center; row-gap: 6px; margin-top: -4px; font-size: 13.5px; color: #5b6474; font-variant-numeric: tabular-nums; }
.expm-a .vd .pill { margin-right: 10px; }
.expm-a .tip { color: #141a24; }
.expm-a .pill { display: inline-flex; align-items: center; justify-content: center; height: 24px; padding: 0 10px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 1px #e1e5eb; box-sizing: border-box; font-size: 11.5px; font-weight: 600; color: #8b93a1; white-space: nowrap; }
.expm-a .pill.good { box-shadow: inset 0 0 0 1px rgba(47, 122, 63, 0.35); color: #2f7a3f; }
.expm-a .pill.live { box-shadow: inset 0 0 0 1px rgba(20, 26, 36, 0.35); color: #141a24; }
.expm-a .pill.warn { box-shadow: inset 0 0 0 1px rgba(184, 71, 31, 0.35); color: #b8471f; }
.expm-a .pill.bad { box-shadow: inset 0 0 0 1px rgba(180, 35, 24, 0.3); color: #b42318; }
.expm-a .figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid #e1e5eb; border-radius: 18px; background: #fff; overflow: hidden; }
.expm-a .fig { display: flex; flex-direction: column; gap: 4px; min-width: 0; padding: 14px 18px 15px; border-left: 1px solid #eef0f3; }
.expm-a .fig:first-child { border-left: 0; }
.expm-a .fl, .expm-a .lb, .expm-a .lr.h { font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #5b6474; white-space: nowrap; }
.expm-a .fig b { margin-top: 2px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; color: #141a24; font-variant-numeric: tabular-nums; white-space: nowrap; }
.expm-a .fig b.up { color: #2f7a3f; }
.expm-a .fig b.dn { color: #b42318; }
.expm-a .fig b.no { font-weight: 500; color: #98a2b3; }
.expm-a .fig small { overflow: hidden; font-size: 12.5px; color: #8b93a1; font-variant-numeric: tabular-nums; text-overflow: ellipsis; white-space: nowrap; }
.expm-a .lh { display: flex; align-items: baseline; gap: 6px; margin-bottom: 10px; }
.expm-a .lb { cursor: default; }
.expm-a .lu { font-size: 12.5px; color: #8b93a1; }
.expm-a .plot { position: relative; height: 132px; cursor: crosshair; }
.expm-a .pa { position: absolute; inset: 8px 40px 8px 4px; }
.expm-a .pa svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.expm-a .yl { position: absolute; left: calc(100% + 12px); transform: translateY(-50%); font-size: 11px; color: #98a2b3; font-variant-numeric: tabular-nums; }
.expm-a .dot, .expm-a .hv { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 999px; background: #3a3390; box-shadow: 0 0 0 2px #fff; pointer-events: none; }
.expm-a .dot.st { background: #b8471f; }
.expm-a .hv { z-index: 2; background: #fff; box-shadow: inset 0 0 0 2px #3a3390, 0 0 0 2px #fff; }
.expm-a .tp { position: absolute; z-index: 3; display: flex; align-items: center; padding: 5px 10px; border-radius: 10px; background: #fff; box-shadow: 0 12px 24px -12px rgba(16, 24, 40, 0.3), 0 0 0 1px #e1e5eb; font-size: 12px; color: #3a4250; font-variant-numeric: tabular-nums; white-space: nowrap; pointer-events: none; }
.expm-a .tp b { font-weight: 600; color: #141a24; }
.expm-a .xl { display: flex; justify-content: space-between; padding: 6px 40px 0 4px; font-size: 11px; color: #98a2b3; font-variant-numeric: tabular-nums; }
.expm-a .xl.one { justify-content: center; }
.expm-a .lr { display: grid; grid-template-columns: 86px 26px minmax(0, 1fr) 96px 44px; align-items: center; column-gap: 10px; min-height: 40px; border-top: 1px solid #eef0f3; }
.expm-a .lr.h { min-height: 0; padding-bottom: 6px; border-top: 0; }
.expm-a .lr.h + .lr { border-top: 0; }
.expm-a .lr.h .c1 { grid-column: span 2; }
.expm-a .lr.h em { margin-left: 8px; font-style: normal; letter-spacing: 0; color: #98a2b3; font-variant-numeric: tabular-nums; }
.expm-a .cc { text-align: center; }
.expm-a .r { text-align: right; }
.expm-a .dt { font-size: 13.5px; color: #3a4250; font-variant-numeric: tabular-nums; white-space: nowrap; }
.expm-a .wk { font-size: 12.5px; color: #8b93a1; font-variant-numeric: tabular-nums; }
.expm-a .sets { display: flex; align-items: center; min-width: 0; overflow: hidden; font-size: 13px; color: #141a24; font-variant-numeric: tabular-nums; white-space: nowrap; }
.expm-a .sets small { margin-left: 2px; font-size: 11px; color: #98a2b3; }
.expm-a .sets .lo { color: #b8471f; }
.expm-a .lr .pill { width: 100%; }
.expm-a .chg { font-size: 13px; font-weight: 600; color: #8b93a1; text-align: right; font-variant-numeric: tabular-nums; }
.expm-a .chg.up { color: #2f7a3f; }
.expm-a .chg.dn { color: #b42318; }
.expm-a .chg.no { font-weight: 500; color: #98a2b3; }
.expm-a .more { margin-top: 8px; padding: 0; border: 0; background: none; font: inherit; font-size: 13px; font-weight: 600; color: #5b6474; cursor: pointer; }
.expm-a .more:hover { color: #141a24; }
.expm-a .none { margin: 0; font-size: 13.5px; color: #8b93a1; }
.expm-a .ft { display: flex; justify-content: flex-end; }
.expm-a .go { height: 36px; padding: 0 18px; border: 0; border-radius: 999px; background: #141a24; font: inherit; font-size: 13.5px; font-weight: 600; color: #fff; cursor: pointer; }
</style>
<script>
(function () {
  var R = document.querySelector('.expm-a');
  if (!R) return;
  var card = R.querySelector('.cd');
  var X_ = '×', EN = '–', EM = '—', MI = '−';
  var SP = '<i class="sp"></i>';
  var CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
  var TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
  var CLOSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';
  var E1 = 'Estimated one-rep max: the session’s best set, weight ' + X_ + ' (1 + reps ÷ 30)';
  var D = [
    { n: 'Barbell Back Squat', t: [3, '8' + EN + '10', 80, 8], lo: 8, hi: 10, g: ['Home gym', 'Fitness First'], s: [
      ['2026-09-08', 1, [[75, 10, 7], [75, 9, 8], [75, 8, 8]]],
      ['2026-09-11', 1, [[75, 10, 7], [75, 10, 8], [75, 9, 8]]],
      ['2026-09-15', 2, [[77.5, 9, 8], [77.5, 9, 8], [77.5, 8, 9]]],
      ['2026-09-18', 2, [[77.5, 10, 8], [77.5, 9, 8], [77.5, 9, 8]]],
      ['2026-09-22', 3, [[80, 9, 8], [80, 8, 8], [80, 8, 9]]],
      ['2026-09-29', 4, [[80, 10, 8], [80, 9, 8], [80, 8, 9]]],
      ['2026-10-06', 5, [[80, 10, 7], [80, 10, 8], [80, 10, 8]]],
      ['2026-10-13', 6, [[82.5, 9, 8], [82.5, 8, 8], [82.5, 8, 9]]],
      ['2026-10-20', 7, [[82.5, 10, 8], [82.5, 9, 8], [82.5, 9, 9]]]] },
    { n: 'Dumbbell Bench Press', t: [3, '8' + EN + '12', 30, 8], lo: 8, hi: 12, g: ['Home gym'], s: [
      ['2026-09-22', 3, [[28, 10], [28, 9], [28, 9]]],
      ['2026-09-29', 4, [[28, 12], [28, 11], [28, 10]]],
      ['2026-10-06', 5, [[30, 10], [30, 9], [30, 9]]],
      ['2026-10-13', 6, [[30, 10], [30, 9], [30, 8]]],
      ['2026-10-16', 6, [[30, 10], [30, 9], [30, 9]]],
      ['2026-10-20', 7, [[30, 9], [30, 9], [30, 8]]]] },
    { n: 'Assisted Pull-Up', t: [1, '12', 12, 2], lo: 12, hi: 12, g: ['tytg'], s: [
      ['2026-10-22', 1, [[12, 12, 2]]]] }
  ];
  var MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  function dd(i) { return new Date(i + 'T12:00:00Z'); }
  function dm(i) { var d = dd(i); return d.getUTCDate() + '/' + (d.getUTCMonth() + 1); }
  function ld(i) { var d = dd(i); return WD[d.getUTCDay()] + ', ' + d.getUTCDate() + ' ' + MO[d.getUTCMonth()]; }
  function k(x) { return String(Math.round(x * 2) / 2); }
  function rp(x) { return Math.round(x * 100); }
  function pc(x) { var r = rp(x); return (r > 0 ? '+' : r < 0 ? MI : '') + Math.abs(r) + '%'; }
  function cls(x) { var r = rp(x); return r > 0 ? 'up' : r < 0 ? 'dn' : 'no'; }
  var since = (function () { var d = dd('2026-10-23'); d.setUTCDate(d.getUTCDate() - 30); return d.toISOString().slice(0, 10); })();
  function judge(L) {
    var ss = L.map(function (x) {
      var b = null;
      x[2].forEach(function (q) { var e = q[0] * (1 + q[1] / 30); if (!b || e > b.e) b = { e: e, q: q }; });
      return { d: x[0], w: x[1], sets: x[2], b: b };
    });
    var n = ss.length;
    if (!n) return { v: 'none', ss: ss, ba: -1, ch: null };
    var ba = 0;
    for (var i = 1; i < n; i++) if (ss[i].b.e > ss[ba].b.e) ba = i;
    var f = ss[0].b.e, l = ss[n - 1].b.e;
    var ch = n > 1 ? (l - f) / f : null;
    var v = n < 3 ? 'none' : l < ss[ba].b.e * 0.95 ? 'drop' : ba < n - 3 ? 'stall' : 'prog';
    return { v: v, ss: ss, ba: ba, ch: ch };
  }
  var VL = { prog: ['Progressing', 'good'], stall: ['Stalling', 'warn'], drop: ['Dropping', 'bad'], none: ['Too early', ''] };
  var st = {};
  function pick(s) {
    st = { s: s, g: 0, open: false, all: false };
    st.r = D[s].s.filter(function (x) { return x[0] >= since; }).length >= 3 ? '30' : 'all';
  }
  var pts = [];
  function render() {
    R.querySelectorAll('[data-st]').forEach(function (b) { b.classList.toggle('on', +b.getAttribute('data-st') === st.s); });
    var X = D[st.s];
    var atGym = st.g === 0 ? X.s : [];
    var J = judge(st.r === '30' ? atGym.filter(function (x) { return x[0] >= since; }) : atGym);
    var ss = J.ss, n = ss.length, last = ss[n - 1], V = VL[J.v], best = ss[J.ba];
    var gym = X.g[0];
    if (X.g.length > 1) {
      gym = '<span class="gw"><button type="button" class="gb" aria-haspopup="listbox" aria-expanded="' + st.open + '">' + X.g[st.g] + CHEV + '</button>' +
        (st.open ? '<div class="gm" role="listbox" aria-label="Gym">' + X.g.map(function (g, i) {
          return '<button type="button" role="option" data-g="' + i + '" aria-selected="' + (i === st.g) + '"' + (i === st.g ? ' class="on"' : '') + '>' + g + (i === st.g ? TICK : '') + '</button>';
        }).join('') + '</div>' : '') + '</span>';
    }
    var h = '<div class="hd"><div class="hl"><h2 class="tt">' + X.n + '</h2><div class="fx">' +
      [X.t[0] + ' ' + X_ + ' ' + X.t[1], k(X.t[2]) + ' kg', 'RPE ' + X.t[3], 'Alex', gym].join(SP) + '</div></div>' +
      '<div class="seg" role="radiogroup" aria-label="Range">' + [['30', '30 days'], ['all', 'All time']].map(function (o) {
        return '<button type="button" role="radio" data-r="' + o[0] + '" aria-checked="' + (st.r === o[0]) + '"' + (st.r === o[0] ? ' class="on"' : '') + '>' + o[1] + '</button>';
      }).join('') + '</div><button type="button" class="x" aria-label="Close">' + CLOSE + '</button></div>';
    var fact, tip = '';
    if (J.v === 'prog') fact = 'New best on ' + dm(best.d);
    else if (J.v === 'stall') {
      fact = 'No new best in ' + (n - 1 - J.ba) + ' sessions';
      var bq = best.b.q;
      var tm = Math.max(X.lo, X.hi - 2);
      tip = bq[1] >= X.hi ? 'Try ' + k(bq[0] + 2.5) + ' kg for ' + (tm > X.lo ? X.lo + EN + tm : X.lo) + ' reps' : 'Aim for ' + (bq[1] + 1) + ' reps at ' + k(bq[0]) + ' kg';
    } else if (J.v === 'drop') fact = 'Latest ' + Math.round((1 - last.b.e / best.b.e) * 100) + '% under the best';
    else fact = n + ' of 3 sessions';
    h += '<div class="vd" aria-live="polite"><span class="pill ' + V[1] + '">' + V[0] + '</span><span>' + fact + '</span>' + (tip ? SP + '<span class="tip">' + tip + '</span>' : '') + '</div>';
    var hv = null;
    ss.forEach(function (s) { s.sets.forEach(function (q) { if (!hv || q[0] > hv.w || (q[0] === hv.w && q[1] > hv.r)) hv = { w: q[0], r: q[1], d: s.d }; }); });
    h += '<div class="figs">' +
      '<div class="fig"><span class="fl">Change</span>' + (J.ch == null ? '<b class="no">' + EM + '</b>' : '<b class="' + cls(J.ch) + '">' + pc(J.ch) + '</b>') + '<small>' + (n ? 'e1RM since ' + dm(ss[0].d) : 'e1RM') + '</small></div>' +
      '<div class="fig"><span class="fl">Best set</span>' + (hv ? '<b>' + k(hv.w) + ' ' + X_ + ' ' + hv.r + '</b><small>' + dm(hv.d) + '</small>' : '<b class="no">' + EM + '</b><small>None yet</small>') + '</div>' +
      '<div class="fig"><span class="fl">Now</span>' + (last ? '<b>' + k(last.b.e) + ' kg</b>' : '<b class="no">' + EM + '</b>') + '<small title="' + E1 + '">e1RM</small></div></div>';
    pts = [];
    if (!n) h += '<p class="none">None yet</p>';
    else {
      var es = ss.map(function (s) { return s.b.e; });
      var lo = Math.floor(Math.min.apply(null, es) - 2), hi = Math.ceil(Math.max.apply(null, es) + 2);
      pts = ss.map(function (s, i) { return { x: n < 2 ? 50 : (i / (n - 1)) * 100, y: ((hi - s.b.e) / (hi - lo)) * 100, s: s }; });
      var path = function (p) { return p.map(function (q, i) { return (i ? 'L' : 'M') + q.x.toFixed(2) + ' ' + q.y.toFixed(2); }).join(' '); };
      var stall = J.v === 'stall' ? pts.slice(J.ba) : [];
      var L = pts[n - 1];
      h += '<div class="ch"><div class="lh"><span class="lb" title="' + E1 + '">Estimated 1RM</span><span class="lu">kg</span></div>' +
        '<div class="plot" role="img" aria-label="Estimated 1RM from ' + k(es[0]) + ' to ' + k(es[n - 1]) + ' kg over ' + n + ' sessions"><div class="pa">' +
        '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">' + [0, 50, 100].map(function (y) {
          return '<line x1="0" x2="100" y1="' + y + '" y2="' + y + '" stroke="#EEF0F3" stroke-width="1" vector-effect="non-scaling-stroke"/>';
        }).join('') +
        (n > 1 ? '<path d="' + path(pts) + '" fill="none" stroke="#3a3390" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' : '') +
        (stall.length > 1 ? '<path d="' + path(stall) + '" fill="none" stroke="#b8471f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' : '') +
        '</svg>' +
        [[hi, 0], [(hi + lo) / 2, 50], [lo, 100]].map(function (t) { return '<span class="yl" style="top:' + t[1] + '%">' + k(t[0]) + '</span>'; }).join('') +

var h='<div class="hd"><div class="tl"><h2 class="ti">'+d.name+'</h2><span class="st '+v[0]+'" title="'+vt+'">'+v[1]+'</span></div><div class="hr"><div class="seg" role="radiogroup" aria-label="Range">'+[['30','30 days'],['all','All time']].map(function(o){var on=st.range===o[0];return'<button type="button" role="radio" aria-checked="'+on+'" class="'+(on?'on':'')+'" data-range="'+o[0]+'">'+o[1]+'</button>';}).join('')+'</div><button type="button" class="x" aria-label="Close">'+XS+'</button></div></div>';
h+='<div class="fl">'+['<span>'+d.n+' × '+d.reps.replace('-','–')+'</span>','<span>'+d.kg+' kg</span>','<span>RPE '+d.rpe+'</span>','<span>Alex</span>',gymH].join(SEP)+'</div>';
pts=[];
if(!n)h+='<p class="none">None yet</p>';
else{
var chg;if(j.v==='none')chg=n+' of 3 sessions';else{var p=pc(j.change);chg='<em class="'+p.c+'">'+p.t+'</em> since '+dm(ss[0].date);}
h+='<div class="sp"><div class="sum"><span class="lb">E1RM</span><span class="fig"><b>'+f5(last.best.e)+'</b><small>kg</small></span><span class="chg">'+chg+'</span></div>';
if(n>1){var es=ss.map(function(s){return s.best.e;}),mn=Math.min.apply(null,es),mx=Math.max.apply(null,es),pad=Math.max((mx-mn)*.15,2),lo=mn-pad,hi=mx+pad;
pts=ss.map(function(s,i){return{x:i/(n-1)*100,y:(hi-s.best.e)/(hi-lo)*100,s:s};});
var dd=pts.map(function(q,i){return(i?'L':'M')+q.x.toFixed(2)+' '+q.y.toFixed(2);}).join(' '),L=pts[n-1];
h+='<div class="ln" role="img" aria-label="E1RM from '+f5(es[0])+' to '+f5(es[n-1])+' kg"><div class="in"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="'+dd+'"/></svg><span class="dot" style="left:'+L.x+'%;top:'+L.y+'%"></span><span class="hv" hidden></span><span class="tt" hidden></span></div></div>';}
h+='</div>';
var ms=Math.max.apply(null,ss.map(function(s){return s.sets.length;})),cols=Math.max(3,ms),tpl='grid-template-columns:80px 20px repeat('+cols+',minmax(0,1fr)) 96px 76px';
var th='<div class="th" style="'+tpl+'"><span></span><span></span>';for(var c=0;c<cols;c++)th+='<span>'+(c<ms?'Set '+(c+1):'')+'</span>';th+='<span></span><span class="r">E1RM</span></div>';
var rows='';
for(var i=n-1;i>=0;i--){var s=ss[i],pv=i?ss[i-1]:null,rs=rowSt(s.sets,r),cells='';
for(var k=0;k<cols;k++){var x=s.sets[k];cells+=x?'<span class="set'+(k===s.bi?' b':'')+'">'+f5(x.w)+' × '+x.r+(x.rpe!=null?'<small>@'+x.rpe+'</small>':'')+'</span>':'<span></span>';}
var cg='<em class="na">—</em>';if(pv){var q=pc((s.best.e-pv.best.e)/pv.best.e);cg='<em class="'+q.c+'">'+q.t+'</em>';}
rows+='<div class="tr" data-i="'+i+'" style="'+tpl+'"><span class="rd">'+logDate(s.date)+'</span><span class="wk">W'+s.wk+'</span>'+cells+'<span><span class="st '+rs[0]+'">'+rs[1]+'</span></span><span class="e r">'+f5(s.best.e)+cg+'</span></div>';}
h+='<div class="tb">'+th+rows+'</div>';}
var tip=tipFor(j,r);
h+='<div class="ft">'+(tip?'<span class="tp">'+tip+'</span>':'')+'<button type="button" class="go">Message Alex</button></div>';
C.innerHTML=h;
R.querySelectorAll('.mk [data-state]').forEach(function(b){var on=b.getAttribute('data-state')===st.k;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});
bind();}
function show(i,tip){
var hv=C.querySelector('.hv'),tt=C.querySelector('.tt');
C.querySelectorAll('.tr').forEach(function(t){t.classList.toggle('hl',tip&&+t.getAttribute('data-i')===i);});
if(!hv||!pts[i])return;
var p=pts[i];hv.style.left=p.x+'%';hv.style.top=p.y+'%';hv.hidden=false;
if(!tip){tt.hidden=true;return;}
var s=p.s,b=s.best.set;
tt.innerHTML='<span>'+logDate(s.date)+'</span>'+SEP+'<span>'+f5(b.w)+' × '+b.r+'</span>'+SEP+'<span>e1RM '+f5(s.best.e)+'</span>';
tt.style.left=p.x+'%';tt.style.top=p.y+'%';
tt.style.transform='translate('+(p.x<20?'-12%':p.x>80?'-88%':'-50%')+','+(p.y<45?'12px':'calc(-100% - 12px)')+')';
tt.hidden=false;}
function hide(){var hv=C.querySelector('.hv'),tt=C.querySelector('.tt');if(hv)hv.hidden=true;if(tt)tt.hidden=true;C.querySelectorAll('.tr.hl').forEach(function(t){t.classList.remove('hl');});}
function bind(){
C.querySelectorAll('.tr').forEach(function(t){t.addEventListener('mouseenter',function(){show(+t.getAttribute('data-i'),false);});t.addEventListener('mouseleave',hide);});
var ln=C.querySelector('.ln');if(!ln)return;
ln.addEventListener('mousemove',function(ev){var b=ln.querySelector('.in').getBoundingClientRect(),n=pts.length,fx=(ev.clientX-b.left)/b.width;show(Math.max(0,Math.min(n-1,Math.round(fx*(n-1)))),true);});
ln.addEventListener('mouseleave',hide);}
R.addEventListener('click',function(ev){
var t=ev.target.closest('[data-state],[data-range],[data-act],[data-gym]');
if(t&&t.hasAttribute('data-state')){pick(t.getAttribute('data-state'));return;}
if(t&&t.hasAttribute('data-range')){st.range=t.getAttribute('data-range');st.menu=false;render();return;}
if(t&&t.getAttribute('data-act')==='gym'){st.menu=!st.menu;render();return;}
if(t&&t.hasAttribute('data-gym')){st.gym=t.getAttribute('data-gym');st.menu=false;render();return;}
if(st.menu){st.menu=false;render();}});
R.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&st.menu){st.menu=false;render();}});
pick('p');
})();
</script>

</section>
