<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ironline</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8f9fb; color: #1b2433;
         font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 20px; color: #5b6576; }

</style>

<body>
  <!-- Shown by the native shell when the live site can't be reached (server.errorPath). -->

    <h1>No connection</h1>
    <p>Ironline needs the internet. Check your connection and try again.</p>
    <button onclick="location.href='https://ironline-production-e741.up.railway.app/client'">Try again</button>
  </div>
