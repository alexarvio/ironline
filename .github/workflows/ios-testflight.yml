# The iPhone app to TestFlight, built on GitHub's own Macs (11 Nov, Alex: "I want to have this shelled in a proper app so
# I can test nicely"). The app is a shell that loads the live site (mobile/capacitor.config.json), so a new build is
# only needed for native changes: run it from GitHub, Actions > iOS to TestFlight > Run workflow.
#
# Signing is Xcode's automatic signing through an App Store Connect API key, so no certificate or profile lives here.
# Repository secrets it reads (Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID   the team's 10-character id (developer.apple.com > Membership details)
#   ASC_KEY_ID      the API key's Key ID
#   ASC_ISSUER_ID   the Issuer ID shown above the keys list
#   ASC_KEY_P8      the whole text of the downloaded AuthKey_<id>.p8 file
name: iOS to TestFlight

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # The newest Xcode on the machine: the App Store takes builds from the current SDK only.
      - name: Pick the newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install and sync the shell
        run: |
          npm ci
          npx cap sync ios

      - name: The API key on disk
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # The key as pasted into the secret, put back in shape (11 Nov: a paste from Windows failed as invalidPEMDocument):
        # Windows line endings and stray spaces gone, the body wrapped at 64 characters between the BEGIN and END lines
        # whether or not those came with it; a whole file pasted as base64 is read too. Only its shape is printed.
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          OUT="$RUNNER_TEMP/keys/AuthKey_$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]').p8"
          node - "$OUT" <<'JS'
          const fs = require('fs');
          const raw = process.env.ASC_KEY_P8 || '';
          let text = raw.replace(/\r/g, '').trim().replace(/^['"]|['"]$/g, '').replace(/\\n/g, '\n');
          if (!text.includes('BEGIN')) {
            const decoded = Buffer.from(text.replace(/\s+/g, ''), 'base64').toString('utf8');
            if (decoded.includes('BEGIN')) text = decoded.replace(/\r/g, '').trim();
          }
          const body = text.replace(/-----(BEGIN|END)[^-]*-----/g, '').replace(/[^A-Za-z0-9+/=]/g, '');
          console.log('key: ' + raw.length + ' characters pasted, ' + (raw.includes('BEGIN') ? 'with' : 'without') + ' a BEGIN line, ' + (raw.includes('\r') ? 'Windows' : 'plain') + ' line endings; body ' + body.length + ' characters');
          if (body.length < 100) {
            console.error('ASC_KEY_P8 holds no key: paste the whole text of the AuthKey .p8 file into it');
            process.exit(1);
          }
          const pem = '-----BEGIN PRIVATE KEY-----\n' + body.match(/.{1,64}/g).join('\n') + '\n-----END PRIVATE KEY-----\n';
          fs.writeFileSync(process.argv[2], pem);
          JS
          # The ids without stray spaces, for the steps after; masked, as this repository's logs are public.
          KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          ISSUER=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          TEAM=$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')
          for v in "$KEY_ID" "$ISSUER" "$TEAM"; do echo "::add-mask::$v"; done
          echo "ids: key ${#KEY_ID}, issuer ${#ISSUER}, team ${#TEAM} characters (10, 36, 10 expected)"
          { echo "KEY_ID=$KEY_ID"; echo "ISSUER=$ISSUER"; echo "TEAM=$TEAM"; echo "KEY_FILE=$OUT"; } >> "$GITHUB_ENV"

      - name: Archive
        # Built unsigned (11 Nov: signing at this step wants a development profile, and that wants a registered device),
        # then given a stand-in signature carrying the app's entitlements (HealthKit, push); the upload below signs it for the
        # App Store, which needs no device.
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -print -exec codesign --force --sign - {} \;
          fi
          # Push for TestFlight and the App Store is Apple's production service (the file says development, for a
          # build from Xcode), so the archive carries production and matches the App Store profile.
          ENT="$RUNNER_TEMP/App.entitlements"
          cp ios/App/App/App.entitlements "$ENT"
          /usr/libexec/PlistBuddy -c "Set :aps-environment production" "$ENT"
          codesign --force --sign - --entitlements "$ENT" "$APP"
          codesign -d --entitlements - "$APP"

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_FILE" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER"

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
