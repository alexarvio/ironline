<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- A brushed teal wall for the Home lifestyle card: turbulence tinted to teal, brushed sideways, softened. -->
  <defs>
    <filter id="paint" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.02" numOctaves="4" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.50  0 0 0 0 0.53  0 0 0 0 1" result="base"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.05" numOctaves="3" seed="3" result="n2"/>
      <feColorMatrix in="n2" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.86  0 0 0 0 0.82  0 0 0 0 0.55" result="light"/>
      <feBlend in="base" in2="light" mode="screen" result="mix"/>
      <feGaussianBlur in="mix" stdDeviation="1.2"/>
    </filter>
    <linearGradient id="depth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b8a8f" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#0f6b70" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a4d52" stop-opacity="0.45"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#137c82"/>
  <rect width="800" height="500" filter="url(#paint)" opacity="0.9"/>
  <rect width="800" height="500" fill="url(#depth)"/>
</svg>
